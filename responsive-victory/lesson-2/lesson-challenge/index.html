<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorite Destinations</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      #home {
        /* max-width: 1300px; */
        margin: auto;
      }
      .carousel img {
        max-height: 95vh;
        /* object-fit: cover; */
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Travel Gallery</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse text-end" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="favorites.html">Other Favorites</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Carousel Gallery -->
    <div id="home" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            src="https://images.pexels.com/photos/5011944/pexels-photo-5011944.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
            class="d-block w-100 carousel-img object-fit-cover"
            alt="New York City"
          />
          <div
            class="carousel-caption bg-secondary p-0 rounded"
            style="--bs-bg-opacity: 0.5"
          >
            <h5>New York City</h5>
            <p>The city that never sleeps.</p>
          </div>
        </div>
        <div class="carousel-item">
          <img
            src="https://images.pexels.com/photos/221519/pexels-photo-221519.jpeg"
            class="d-block w-100 carousel-img object-fit-cover"
            alt="Munich"
          />
          <div
            class="carousel-caption bg-secondary p-0 rounded"
            style="--bs-bg-opacity: 0.5"
          >
            <h5>Munich</h5>
            <p>Beer, art, and beautiful architecture.</p>
          </div>
        </div>
        <div class="carousel-item">
          <img
            src="https://images.pexels.com/photos/753337/pexels-photo-753337.jpeg"
            class="d-block w-100 carousel-img object-fit-cover"
            alt="Prague"
          />
          <div
            class="carousel-caption bg-secondary p-0 rounded"
            style="--bs-bg-opacity: 0.5"
          >
            <h5>Prague</h5>
            <p>Historic charm and stunning views.</p>
          </div>
        </div>
        <div class="carousel-item">
          <img
            src="https://images.pexels.com/photos/946630/pexels-photo-946630.jpeg"
            class="d-block w-100 carousel-img object-fit-cover"
            alt="Hong Kong"
          />
          <div
            class="carousel-caption bg-secondary p-0 rounded"
            style="--bs-bg-opacity: 0.5"
          >
            <h5>Hong Kong</h5>
            <p>Where East meets West.</p>
          </div>
        </div>
      </div>
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#home"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#home"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
